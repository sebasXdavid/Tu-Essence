  <title id="title">Imagen de perfume pendiente</title>
  <desc id="description">Marcador visual para reemplazar con la fotografía del producto.</desc>
  <rect width="640" height="800" fill="#f4efed"/>
  <circle cx="320" cy="350" r="210" fill="#ece2df"/>
  <rect x="250" y="168" width="140" height="84" rx="8" fill="#7a2333"/>
  <rect x="275" y="128" width="90" height="52" rx="5" fill="#211d1d"/>
